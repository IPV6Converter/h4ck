<script>
  function compressIPv6(groups) {
    let bestStart = -1;
    let bestLen = 0;

    let start = -1;
    let len = 0;

    for (let i = 0; i < groups.length; i++) {
      if (groups[i] === "0") {
        if (start === -1) start = i;
        len++;
      } else {
        if (len > bestLen) {
          bestStart = start;
          bestLen = len;
        }
        start = -1;
        len = 0;
      }
    }

    if (len > bestLen) {
      bestStart = start;
      bestLen = len;
    }

    if (bestLen > 1) {
      groups.splice(bestStart, bestLen, "");

      if (bestStart === 0) groups.unshift("");
      if (bestStart + bestLen === 8) groups.push("");
    }

    return groups.join(":").replace(/:{3,}/g, "::");
  }

  function convertToIPv6() {
    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");

    try {

      // Extraer SOLO la parte numérica después de "Peer"
      let clean = input;

      if (clean.toLowerCase().includes("peer")) {
        clean = clean.split(/peer/i)[1].trim();
      }

      // Obtener bytes
      const parts = clean.split(".").filter(x => x !== "");

      if (parts.length !== 32) {
        throw new Error(
          "Se esperaban 32 bytes IPv6 y llegaron " + parts.length
        );
      }

      const bytes = parts.map(n => {
        const v = parseInt(n, 10);

        if (isNaN(v) || v < 0 || v > 255) {
          throw new Error("Byte inválido: " + n);
        }

        return v;
      });

      const groups = [];

      for (let i = 0; i < 32; i += 2) {
        const value = (bytes[i] << 8) | bytes[i + 1];
        groups.push(value.toString(16));
      }

      const ipv6 = compressIPv6(groups);

      output.textContent = ipv6;

    } catch (e) {
      output.textContent = "Error: " + e.message;
    }
  }

  function expandIPv6(address) {

    if (!address.includes("::")) {
      return address.split(":");
    }

    const sides = address.split("::");

    const left = sides[0] ? sides[0].split(":") : [];
    const right = sides[1] ? sides[1].split(":") : [];

    const missing = 8 - (left.length + right.length);

    return [
      ...left,
      ...Array(missing).fill("0"),
      ...right
    ];
  }

  function convertToBGP() {
    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");

    try {

      const groups = expandIPv6(input);

      if (groups.length !== 8) {
        throw new Error("IPv6 inválida");
      }

      const bytes = [];

      for (const group of groups) {

        const value = parseInt(group || "0", 16);

        if (isNaN(value) || value < 0 || value > 0xffff) {
          throw new Error("Grupo IPv6 inválido: " + group);
        }

        bytes.push((value >> 8) & 0xff);
        bytes.push(value & 0xff);
      }

      output.textContent =
        "BGP Status Peer " + bytes.join(".");

    } catch (e) {
      output.textContent = "Error: " + e.message;
    }
  }

  function clearAll() {
    document.getElementById("input").value = "";
    document.getElementById("output").textContent = "---";
  }
</script>
