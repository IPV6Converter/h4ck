<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conversor BGP IPv6</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --ok: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: white;
    }

    p {
      color: var(--muted);
      text-align: center;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      background: #020617;
      color: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 200px;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    .convert {
      background: var(--accent);
      color: white;
    }

    .convert:hover {
      background: var(--accent-hover);
    }

    .clear {
      background: #1e293b;
      color: white;
    }

    .clear:hover {
      background: #334155;
    }

    .result {
      margin-top: 25px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }

    .label {
      color: var(--muted);
      margin-bottom: 10px;
      font-size: 14px;
    }

    .output {
      font-size: 20px;
      font-weight: bold;
      color: var(--ok);
      word-break: break-word;
    }

    .example {
      margin-top: 25px;
      font-size: 14px;
      color: var(--muted);
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 15px;
    }

    code {
      color: #93c5fd;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Conversor BGP ↔ IPv6</h1>

  <p>
    Convierte automáticamente entre formato BGP Status Peer y dirección IPv6 abreviada.
  </p>

  <textarea id="input" placeholder="Pega aquí una línea BGP o una IPv6..."></textarea>

  <div class="buttons">
    <button class="convert" onclick="convertToIPv6()">
      BGP → IPv6
    </button>

    <button class="convert" onclick="convertToBGP()">
      IPv6 → BGP
    </button>

    <button class="clear" onclick="clearAll()">
      Limpiar
    </button>
  </div>

  <div class="result">
    <div class="label">Resultado:</div>
    <div class="output" id="output">---</div>
  </div>

  <div class="example">
    <strong>Ejemplo:</strong><br><br>

    <code>
      BGP Status Peer 0.2.253.0.0.0.0.1.0.171.0.0.0.0.0.0.0.1.2.253.0.0.0.0.1.0.171.0.0.0.0.0.0.0.2
    </code>

    <br><br>

    →

    <br><br>

    <code>fd00:0:1:ab::2</code>
  </div>
</div>

<script>
  function compressIPv6(groups) {
    let bestStart = -1;
    let bestLen = 0;

    let start = -1;
    let len = 0;

    for (let i = 0; i < groups.length; i++) {
      if (groups[i] === "0") {
        if (start === -1) start = i;
        len++;
      } else {
        if (len > bestLen) {
          bestStart = start;
          bestLen = len;
        }
        start = -1;
        len = 0;
      }
    }

    if (len > bestLen) {
      bestStart = start;
      bestLen = len;
    }

    if (bestLen > 1) {
      groups.splice(bestStart, bestLen, "");
      if (bestStart === 0) groups.unshift("");
      if (bestStart + bestLen === 8) groups.push("");
    }

    return groups.join(":").replace(/:{3,}/, "::");
  }

  function convertToIPv6() {
    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");

    try {
      const numbers = input.match(/\d+/g);

      if (!numbers || numbers.length < 16) {
        throw new Error("Formato BGP inválido");
      }

      const bytes = numbers.map(n => parseInt(n));

      if (bytes.length % 2 !== 0) {
        throw new Error("Cantidad de bytes inválida");
      }

      const groups = [];

      for (let i = 0; i < bytes.length; i += 2) {
        const value = (bytes[i] << 8) | bytes[i + 1];
        groups.push(value.toString(16));
      }

      const ipv6 = compressIPv6(groups);

      output.textContent = ipv6;

    } catch (e) {
      output.textContent = "Error: " + e.message;
    }
  }

  function expandIPv6(address) {
    if (address.includes("::")) {
      const parts = address.split("::");

      const left = parts[0] ? parts[0].split(":") : [];
      const right = parts[1] ? parts[1].split(":") : [];

      const missing = 8 - (left.length + right.length);

      return [
        ...left,
        ...Array(missing).fill("0"),
        ...right
      ];
    }

    return address.split(":");
  }

  function convertToBGP() {
    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");

    try {
      const groups = expandIPv6(input);

      if (groups.length !== 8) {
        throw new Error("IPv6 inválida");
      }

      const bytes = [];

      for (const group of groups) {
        const value = parseInt(group || "0", 16);

        const high = (value >> 8) & 0xff;
        const low = value & 0xff;

        bytes.push(high);
        bytes.push(low);
      }

      const result = "BGP Status Peer " + bytes.join(".");

      output.textContent = result;

    } catch (e) {
      output.textContent = "Error: " + e.message;
    }
  }

  function clearAll() {
    document.getElementById("input").value = "";
    document.getElementById("output").textContent = "---";
  }
</script>

</body>
</html>
