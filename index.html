<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conversor BGP ↔ IPv6</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --ok: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: white;
      font-size: 42px;
    }

    p {
      text-align: center;
      color: var(--muted);
      margin-bottom: 25px;
      font-size: 18px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      background: #020617;
      color: white;
      border: 2px solid #1d4ed8;
      border-radius: 14px;
      padding: 18px;
      font-size: 16px;
      line-height: 1.6;
      outline: none;
    }

    textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.25);
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 200px;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    .convert {
      background: var(--accent);
      color: white;
    }

    .convert:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .clear {
      background: #1e293b;
      color: white;
    }

    .clear:hover {
      background: #334155;
    }

    .result {
      margin-top: 25px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .label {
      color: var(--muted);
      margin-bottom: 12px;
      font-size: 15px;
    }

    .output {
      font-size: 28px;
      font-weight: bold;
      color: var(--ok);
      word-break: break-word;
      font-family: Consolas, monospace;
    }

    .error {
      color: var(--error);
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 30px;
      }

      .output {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Conversor BGP ↔ IPv6</h1>

  <p>
    Convierte automáticamente líneas BGP a IPv6 abreviada y viceversa.
  </p>

  <textarea id="input" placeholder="Pega aquí una línea BGP o una IPv6..."></textarea>

  <div class="buttons">
    <button class="convert" onclick="convertToIPv6()">
      BGP → IPv6
    </button>

    <button class="convert" onclick="convertToBGP()">
      IPv6 → BGP
    </button>

    <button class="clear" onclick="clearAll()">
      Limpiar
    </button>
  </div>

  <div class="result">
    <div class="label">Resultado:</div>
    <div class="output" id="output">---</div>
  </div>

</div>

<script>

  function compressIPv6(groups) {

    let bestStart = -1;
    let bestLen = 0;

    let start = -1;
    let len = 0;

    for (let i = 0; i < groups.length; i++) {

      if (groups[i] === "0") {

        if (start === -1) start = i;
        len++;

      } else {

        if (len > bestLen) {
          bestStart = start;
          bestLen = len;
        }

        start = -1;
        len = 0;
      }
    }

    if (len > bestLen) {
      bestStart = start;
      bestLen = len;
    }

    if (bestLen > 1) {

      groups.splice(bestStart, bestLen, "");

      if (bestStart === 0) groups.unshift("");
      if (bestStart + bestLen === 8) groups.push("");
    }

    return groups.join(":").replace(/:{3,}/g, "::");
  }

  function convertToIPv6() {

    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");

    try {

      const matches = input.match(/\d+/g);

      if (!matches || matches.length < 16) {
        throw new Error("No se encontraron suficientes bytes");
      }

      const allBytes = matches.map(v => parseInt(v, 10));

      // Usar los últimos 16 bytes válidos
      const bytes = allBytes.slice(-16);

      const groups = [];

      for (let i = 0; i < 16; i += 2) {

        const value = (bytes[i] << 8) | bytes[i + 1];

        groups.push(value.toString(16));
      }

      const ipv6 = compressIPv6(groups);

      output.classList.remove("error");
      output.textContent = ipv6;

    } catch (e) {

      output.classList.add("error");
      output.textContent = "Error: " + e.message;
    }
  }

  function expandIPv6(address) {

    if (!address.includes("::")) {
      return address.split(":");
    }

    const sides = address.split("::");

    const left = sides[0] ? sides[0].split(":") : [];
    const right = sides[1] ? sides[1].split(":") : [];

    const missing = 8 - (left.length + right.length);

    return [
      ...left,
      ...Array(missing).fill("0"),
      ...right
    ];
  }

  function convertToBGP() {

    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");

    try {

      const groups = expandIPv6(input);

      if (groups.length !== 8) {
        throw new Error("IPv6 inválida");
      }

      const bytes = [];

      for (const group of groups) {

        const value = parseInt(group || "0", 16);

        if (isNaN(value) || value < 0 || value > 65535) {
          throw new Error("Grupo IPv6 inválido");
        }

        bytes.push((value >> 8) & 0xff);
        bytes.push(value & 0xff);
      }

      output.classList.remove("error");

      output.textContent =
        "BGP Status Peer " + bytes.join(".");

    } catch (e) {

      output.classList.add("error");
      output.textContent = "Error: " + e.message;
    }
  }

  function clearAll() {

    document.getElementById("input").value = "";

    const output = document.getElementById("output");

    output.classList.remove("error");
    output.textContent = "---";
  }

</script>

</body>
</html>
