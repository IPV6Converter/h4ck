<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Conversor IPv6 ↔ Decimal BGP</title>

<style>
    body {
        font-family: "Segoe UI", Roboto, Arial;
        margin: 0;
        padding: 0;
        background: #f4f4f7;
        color: #222;
        transition: 0.3s;
    }

    @media (prefers-color-scheme: dark) {
        body {
            background: #1e1e1e;
            color: #eee;
        }
        .card {
            background: #2a2a2a;
            color: #eee;
        }
        input, textarea {
            background: #333;
            color: #eee;
            border: 1px solid #555;
        }
    }

    h1 {
        text-align: center;
        margin-top: 30px;
        font-size: 32px;
    }

    .container {
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        margin-bottom: 25px;
        transition: 0.3s;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    button {
        background: #0078ff;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 15px;
        transition: 0.2s;
    }

    button:hover {
        background: #005fcc;
        transform: scale(1.03);
    }

    textarea {
        resize: none;
        height: 70px;
    }
</style>
</head>

<body>

<h1>Conversor IPv6 ↔ Decimal BGP</h1>

<div class="container">

    <div class="card">
        <h3>Introduce IPv6, decimal o línea BGP</h3>
        <input id="input" placeholder="Ej: fd00:0:1:ab::2  ó  253.0.0.0...  ó  BGP Status Peer ...">
        <button onclick="convert()">Convertir</button>
    </div>

    <div class="card">
        <h3>IPv6 abreviada</h3>
        <textarea id="ipv6_out" readonly></textarea>

        <h3>Decimal BGP</h3>
        <textarea id="dec_out" readonly></textarea>
    </div>

</div>

<script>
// Expande IPv6
function expandIPv6(ip) {
    let parts = ip.split("::");
    let left = parts[0].split(":");
    let right = parts[1] ? parts[1].split(":") : [];
    let missing = 8 - (left.length + right.length);
    let zeros = Array(missing).fill("0000");
    return [...left, ...zeros, ...right].map(b => b.padStart(4,"0"));
}

// Comprime IPv6
function compressIPv6(blocks) {
    let bestStart = -1, bestLen = 0;
    let curStart = -1, curLen = 0;

    for (let i = 0; i < blocks.length; i++) {
        if (blocks[i] === "0000") {
            if (curStart === -1) curStart = i;
            curLen++;
        } else {
            if (curLen > bestLen) {
                bestLen = curLen;
                bestStart = curStart;
            }
            curStart = -1;
            curLen = 0;
        }
    }
    if (curLen > bestLen) {
        bestLen = curLen;
        bestStart = curStart;
    }

    let ipv6 = blocks.map(b => b.replace(/^0+/, "") || "0").join(":");

    if (bestLen > 1) {
        let before = blocks.slice(0, bestStart).map(b => b.replace(/^0+/, "") || "0").join(":");
        let after = blocks.slice(bestStart + bestLen).map(b => b.replace(/^0+/, "") || "0").join(":");
        return before + "::" + after;
    }

    return ipv6;
}

// IPv6 → decimal
function ipv6ToDecimal(ip) {
    let blocks = expandIPv6(ip);
    let dec = [];
    blocks.forEach(b => {
        dec.push(parseInt(b.slice(0,2),16));
        dec.push(parseInt(b.slice(2,4),16));
    });
    return dec.join(".");
}

// decimal → IPv6 abreviada
function decimalToIPv6(dec) {
    let parts = dec.split(".");
    let hex = [];
    for (let i = 0; i < 16; i += 2) {
        hex.push(
            Number(parts[i]).toString(16).padStart(2,"0") +
            Number(parts[i+1]).toString(16).padStart(2,"0")
        );
    }
    return compressIPv6(hex);
}

// Detección automática
function convert() {
    let input = document.getElementById("input").value.trim();

    input = input.replace(/^BGP Status Peer\s+/i, "");

    if (input.includes(":")) {
        document.getElementById("ipv6_out").value = compressIPv6(expandIPv6(input));
        document.getElementById("dec_out").value = ipv6ToDecimal(input);
    }
    else if (input.includes(".")) {
        document.getElementById("ipv6_out").value = decimalToIPv6(input);
        document.getElementById("dec_out").value = input;
    }
    else {
        document.getElementById("ipv6_out").value = "Entrada no válida";
        document.getElementById("dec_out").value = "";
    }
}
</script>

</body>
</html>
