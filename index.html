<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Conversor IPv6 ↔ Decimal BGP</title>

<style>
    :root {
        --primary: #4f8cff;
        --primary-dark: #2f6be0;
        --bg-light: #f5f7fa;
        --bg-dark: #1b1d22;
        --card-light: #ffffff;
        --card-dark: #26282e;
        --text-light: #222;
        --text-dark: #eee;
        --accent: #ffb300;
    }

    body {
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: var(--bg-light);
        color: var(--text-light);
        transition: 0.3s;
    }

    @media (prefers-color-scheme: dark) {
        body {
            background: var(--bg-dark);
            color: var(--text-dark);
        }
        .card {
            background: var(--card-dark);
        }
        input, textarea {
            background: #333;
            color: #eee;
            border: 1px solid #555;
        }
        .hint {
            color: #aaa;
        }
    }

    h1 {
        text-align: center;
        margin-top: 30px;
        font-size: 34px;
        font-weight: 600;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-top: 5px;
        font-size: 15px;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px 40px;
    }

    .card {
        background: var(--card-light);
        padding: 25px;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        margin-bottom: 25px;
        border-top: 4px solid var(--primary);
        transition: 0.3s;
    }

    .card h3 {
        margin-top: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        background: var(--accent);
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        font-size: 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    textarea {
        resize: none;
        height: 70px;
    }

    .btn-row {
        text-align: center;
        margin-top: 18px;
    }

    button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px 28px;
        font-size: 16px;
        border-radius: 999px;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 3px 10px rgba(79,140,255,0.4);
    }

    button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px) scale(1.03);
        box-shadow: 0 5px 16px rgba(79,140,255,0.55);
    }

    .hint {
        font-size: 13px;
        color: #888;
        margin-top: 6px;
    }
</style>
</head>

<body>

<h1>Conversor IPv6 ↔ Decimal BGP</h1>
<p class="subtitle">Convierte IPv6, decimal BGP o líneas completas de “BGP Status Peer”</p>

<div class="container">

    <div class="card">
        <h3><span class="pill">Entrada</span> Dirección o línea BGP</h3>
        <input id="input" placeholder="Ej: fd00:0:1:ab::2  ·  0.2.253.0.0.0.1.0.171...  ·  BGP Status Peer ...">
        <p class="hint">
            Ejemplo: BGP Status Peer 0.2.253.0.0.0.0.1.0.171.0.0.0.0.0.0.0.1.2.253.0.0.0.0.1.0.171.0.0.0.0.0.0.0.2
        </p>
        <div class="btn-row">
            <button onclick="convert()">Convertir</button>
        </div>
    </div>

    <div class="card">
        <h3><span class="pill">Salida</span> IPv6 abreviada</h3>
        <textarea id="ipv6_out" readonly></textarea>

        <h3 style="margin-top:20px;"><span class="pill">Salida</span> Decimal BGP</h3>
        <textarea id="dec_out" readonly></textarea>
    </div>

</div>

<script>
// Expande IPv6 abreviada
function expandIPv6(ip) {
    let parts = ip.split("::");
    let left = parts[0] ? parts[0].split(":") : [];
    let right = parts[1] ? parts[1].split(":") : [];
    let missing = 8 - (left.length + right.length);
    let zeros = Array(missing).fill("0000");
    return [...left, ...zeros, ...right].map(b => b.padStart(4,"0"));
}

// Comprime IPv6 al máximo
function compressIPv6(blocks) {
    let bestStart = -1, bestLen = 0;
    let curStart = -1, curLen = 0;

    for (let i = 0; i < blocks.length; i++) {
        if (blocks[i] === "0000") {
            if (curStart === -1) curStart = i;
            curLen++;
        } else {
            if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }
            curStart = -1; curLen = 0;
        }
    }
    if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }

    let pretty = blocks.map(b => b.replace(/^0+/, "") || "0").join(":");

    if (bestLen > 1) {
        let before = blocks.slice(0, bestStart).map(b => b.replace(/^0+/, "") || "0").join(":");
        let after = blocks.slice(bestStart + bestLen).map(b => b.replace(/^0+/, "") || "0").join(":");
        if (!before) return "::" + after;
        if (!after) return before + "::";
        return before + "::" + after;
    }

    return pretty;
}

// IPv6 → decimal BGP
function ipv6ToDecimal(ip) {
    let blocks = expandIPv6(ip);
    let dec = [0, 2]; // prefijo BGP

    blocks.forEach(b => {
        dec.push(parseInt(b.slice(0,2),16));
        dec.push(parseInt(b.slice(2,4),16));
    });

    return dec.join(".");
}

// decimal → IPv6 (corregido)
function decimalToIPv6(decString) {
    let parts = decString.split(".").map(x => x.trim()).filter(x => x !== "");

    // Si hay dos direcciones, nos quedamos con la última
    if (parts.length > 18) {
        parts = parts.slice(parts.length - 18);
    }

    // Si empieza por 0.2, quitamos ese prefijo
    if (parts[0] === "0" && parts[1] === "2") {
        parts = parts.slice(2);
    }

    if (parts.length !== 16) {
        throw new Error("Formato decimal inválido para IPv6");
    }

    let hex = [];
    for (let i = 0; i < 16; i += 2) {
        hex.push(
            Number(parts[i]).toString(16).padStart(2,"0") +
            Number(parts[i+1]).toString(16).padStart(2,"0")
        );
    }

    return compressIPv6(hex);
}

// Detección automática
function convert() {
    let raw = document.getElementById("input").value.trim();
    let ipv6Out = document.getElementById("ipv6_out");
    let decOut = document.getElementById("dec_out");

    ipv6Out.value = "";
    decOut.value = "";

    raw = raw.replace(/^BGP Status Peer\s+/i, "").trim();

    try {
        if (raw.includes(":")) {
            ipv6Out.value = compressIPv6(expandIPv6(raw));
            decOut.value = ipv6ToDecimal(raw);
        } else if (raw.includes(".")) {
            ipv6Out.value = decimalToIPv6(raw);
            decOut.value = raw;
        } else {
            ipv6Out.value = "Entrada no válida";
        }
    } catch (e) {
        ipv6Out.value = "Error: " + e.message;
    }
}
</script>

</body>
</html>
